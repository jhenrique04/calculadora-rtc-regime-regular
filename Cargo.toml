[workspace]
resolver = "2"
members = [
    "banco",
    "core",
    "server",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
lto = "thin"
